<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Equipment Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com;
  frame-src https://*.firebaseapp.com https://*.googleapis.com https://accounts.google.com;
  frame-ancestors 'none';
  form-action 'none';
  base-uri 'self';
  object-src 'none';
">
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --card-border: #334155;
    --accent: #38bdf8; --text: #e2e8f0; --text-dim: #94a3b8;
    --danger: #f87171; --success: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px;
  }
  header { padding: 20px 16px 12px; text-align: center; }
  header h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: 0.3px; }
  header p { margin: 2px 0 0; color: var(--text-dim); font-size: 12px; }
  .status-banner {
    margin: 12px 16px; padding: 10px 14px; border-radius: 10px; font-size: 13px;
    background: #422006; color: #fbbf24; border: 1px solid #78350f; display: none;
  }
  .status-banner.show { display: block; }
  .scan-area {
    margin: 16px; padding: 26px 16px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--card-border); text-align: center;
  }
  .entry-buttons { display: flex; gap: 8px; }
  .entry-buttons button {
    flex: 1; border: none; border-radius: 999px; padding: 15px 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: transform 0.1s, background 0.2s;
  }
  .entry-buttons button:active { transform: scale(0.97); }
  #scanBarcodeEntryBtn { background: var(--accent); color: #052e3d; }
  #scanNfcEntryBtn { background: #fbbf24; color: #3a2c02; }
  #scanNfcEntryBtn.scanning { background: var(--danger); color: #3f0d0d; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  button:disabled { background: #475569 !important; color: #94a3b8 !important; cursor: not-allowed; }
  .scan-hint { margin-top: 12px; font-size: 12px; color: var(--text-dim); }
  .manual-link {
    display: block; margin-top: 10px; background: none; border: none; color: var(--accent);
    font-size: 12px; text-decoration: underline; cursor: pointer;
  }
  .toolbar { display: flex; gap: 8px; padding: 0 16px; margin-bottom: 8px; flex-wrap: wrap; }
  .toolbar input[type="text"], .toolbar select {
    flex: 1; min-width: 100px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--card-border);
    background: var(--card); color: var(--text); font-size: 14px;
  }
  .section-label {
    padding: 0 16px; color: var(--text-dim); font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.8px; margin: 18px 0 8px;
  }
  .item-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .item-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
    padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .badges { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .badge-type { background: var(--accent); color: #052e3d; }
  .badge-unit { background: #334155; color: var(--text); }
  .badge-pass { background: var(--success); color: #062012; }
  .badge-fail { background: var(--danger); color: #3f0d0d; }
  .item-scanned { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .item-actions { display: flex; gap: 6px; }
  .item-actions button {
    background: #0f172a; border: 1px solid var(--card-border); color: var(--text-dim);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  .empty-state { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 14px; }
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
    border-top: 1px solid var(--card-border); padding: 10px 16px; display: flex; gap: 8px; justify-content: center;
  }
  .bottom-bar button {
    flex: 1; max-width: 200px; padding: 12px; border-radius: 10px; border: none;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  #exportBtn { background: #334155; color: var(--text); }
  #clearBtn { background: #7f1d1d; color: #fecaca; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none;
    align-items: flex-end; justify-content: center; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card); width: 100%; max-width: 480px; border-radius: 16px 16px 0 0;
    padding: 20px; max-height: 92vh; overflow-y: auto; animation: slideUp 0.2s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal h2 { margin: 0 0 4px; font-size: 17px; }
  .modal .tag-id { font-family: monospace; color: var(--text-dim); font-size: 12px; margin-bottom: 16px; word-break: break-all; }
  .modal label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; margin-top: 12px; }
  .modal input, .modal textarea, .modal select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--card-border);
    background: #0f172a; color: var(--text); font-size: 14px;
  }
  .type-toggle { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .type-toggle button {
    flex: 1; min-width: 90px; padding: 10px; border-radius: 8px; border: 1px solid var(--card-border);
    background: #0f172a; color: var(--text-dim); font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .type-toggle button.active { background: var(--accent); color: #052e3d; border-color: var(--accent); }
  .field-row { display: flex; gap: 8px; }
  .field-row > div { flex: 1; }
  .type-fields { display: none; }
  .type-fields.active { display: block; }
  .modal-buttons { display: flex; gap: 8px; margin-top: 18px; }
  .modal-buttons button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
  #saveItemBtn { background: var(--accent); color: #052e3d; }
  #cancelModalBtn { background: #334155; color: var(--text); }
  #deleteItemBtn { background: #7f1d1d; color: #fecaca; flex: 0 0 auto; padding: 12px 16px; }

  .input-with-scan { display: flex; gap: 6px; align-items: stretch; }
  .input-with-scan input { flex: 1; }
  .scan-btn, .scan-nfc-btn, .write-nfc-btn, .scan-cam-btn, .write-date-btn {
    flex: 0 0 auto; width: 42px; border-radius: 8px; border: 1px solid var(--card-border);
    background: #0f172a; font-size: 18px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  .scan-btn { color: var(--accent); }
  .scan-cam-btn { color: #34d399; }
  .write-date-btn { color: #f472b6; }
  .scan-nfc-btn { color: #fbbf24; }
  .write-nfc-btn { color: #a78bfa; }
  .mask-row {
    background: #0f172a; border: 1px solid var(--card-border); border-radius: 10px;
    padding: 10px; margin-top: 8px;
  }
  .mask-row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .mask-row-header select { width: auto; flex: 1; margin-right: 8px; }
  .mask-row-remove {
    flex: 0 0 auto; background: #7f1d1d; color: #fecaca; border: none; border-radius: 6px;
    width: 30px; height: 30px; font-size: 14px; cursor: pointer;
  }
  .mask-row-date { margin-top: 6px; }
  .mask-row-date label { font-size: 11px; margin-top: 4px; }
  .subsection-label {
    margin-top: 16px; padding-top: 10px; border-top: 1px dashed var(--card-border);
    font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;
  }

  .view-row {
    display: flex; justify-content: space-between; gap: 12px; padding: 8px 0;
    border-bottom: 1px solid #263244; font-size: 14px;
  }
  .view-row .view-label { color: var(--text-dim); flex: 0 0 auto; }
  .view-row .view-value { color: var(--text); text-align: right; word-break: break-word; }

  .history-section { margin-top: 16px; border-top: 1px solid var(--card-border); padding-top: 12px; }
  .history-toggle { background: none; border: none; color: var(--accent); font-size: 13px; padding: 0; cursor: pointer; }
  .history-list { margin-top: 10px; max-height: 160px; overflow-y: auto; display: none; }
  .history-list.show { display: block; }
  .history-row {
    display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0;
    border-bottom: 1px solid #263244; color: var(--text-dim);
  }
  .history-row .hist-loc { color: var(--text); }

  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--card);
    border: 1px solid var(--card-border); padding: 10px 18px; border-radius: 999px; font-size: 13px;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }

  #nfcFlash {
    position: fixed; inset: 0; background: #4ade80; opacity: 0;
    pointer-events: none; z-index: 500; transition: opacity 0.12s ease-out;
  }
  #nfcFlash.show { opacity: 0.55; transition: opacity 0.04s ease-out; }

  .scanner-overlay {
    position: fixed; inset: 0; background: #000; display: none;
    flex-direction: column; z-index: 300;
  }
  .scanner-overlay.show { display: flex; }
  .scanner-overlay video { flex: 1; width: 100%; object-fit: cover; }
  .scanner-hint {
    position: absolute; top: 16px; left: 0; right: 0; text-align: center;
    color: #fff; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); padding: 0 16px;
  }
  .scanner-frame {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 80%; max-width: 320px; height: 120px; border: 3px solid var(--accent);
    border-radius: 12px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.4);
  }
  .scanner-cancel {
    padding: 16px; background: #000; border: none; color: #fff; font-size: 15px;
    font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
<div class="scanner-overlay" id="scannerOverlay">
  <div class="scanner-hint" id="scannerHint">Point camera at the barcode</div>
  <video id="scannerVideo" autoplay playsinline muted></video>
  <div class="scanner-frame"></div>
  <button type="button" class="scanner-cancel" id="scannerCancelBtn">Cancel</button>
</div>

<header>
  <h1>🦺 Safety Equipment Tracker</h1>
  <p id="itemCount">0 items tracked</p>
</header>

<div class="status-banner" id="statusBanner"></div>

<div class="scan-area">
  <div class="entry-buttons">
    <button id="scanBarcodeEntryBtn">📷 Scan Barcode</button>
    <button id="scanNfcEntryBtn">📡 Scan NFC</button>
  </div>
  <div class="scan-hint" id="scanHint">Scan the collection point's barcode or RFID tag to find or add its record</div>
  <button type="button" class="manual-link" id="manualEntryLink">Can't scan? Enter an ID manually</button>
  <button type="button" class="manual-link" id="componentHistoryLink">📜 Look up a Frame/Cylinder/Mask's movement history</button>
  <button type="button" class="manual-link" id="addUnassignedLink">➕ Add equipment not at a location yet</button>
  <button type="button" class="manual-link" id="startNewMonthLink" style="color:#fbbf24;">🗓️ Start new inspection month</button>
  <button type="button" class="manual-link" id="previousMonthsLink">📁 Previous months</button>
  <button type="button" class="manual-link" id="downloadByTypeLink">📦 Download by equipment type (SCBAs, Cylinders, Frames…)</button>
  <button type="button" class="manual-link" id="cloudLink">☁️ Cloud sync</button>
  <button type="button" class="manual-link" id="btReaderLink">🔵 Connect Bluetooth NFC reader (ACR1555U)</button>
  <button type="button" class="manual-link" id="customReportLink">📊 Build a custom Excel report (pick areas &amp; equipment)</button>
  <button type="button" class="manual-link" id="uploadCalibrationLink">📤 Update calibration list from Excel</button>
  <input type="file" id="calibrationFileInput" accept=".xlsx" style="display:none;">
  <button type="button" class="manual-link" id="uploadMonthlyLink">📥 Import monthly inspection results</button>
  <input type="file" id="monthlyFileInput" accept=".xlsx" style="display:none;">
  <button type="button" class="manual-link" id="hardResetLink" style="color:#f87171;">⚠️ Reset app data & reload latest (use if updates aren't showing up)</button>
</div>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="Search...">
  <select id="viewMode" title="What to list">
    <option value="points">📍 Collection points</option>
    <option value="pieces">🔧 Equipment pieces (frames, cylinders, masks)</option>
  </select>
  <select id="typeFilter"><option value="">All types</option></select>
  <select id="unitFilter"><option value="">All units</option></select>
</div>

<div class="section-label">Inventory</div>
<div class="item-list" id="itemList"></div>

<div class="bottom-bar">
  <button id="exportBtn">Export CSV</button>
  <button id="exportXlsxBtn">Export XLSX</button>
  <button id="clearBtn">Clear All</button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">New Item</h2>
    <div class="tag-id" id="modalTagId"></div>

    <label>Equipment Type</label>
    <div class="type-toggle" id="typeToggle">
      <button type="button" data-type="Extinguisher">Extinguisher</button>
      <button type="button" data-type="Emergency Light">Emerg. Light</button>
      <button type="button" data-type="Eyewash Station">Eyewash</button>
      <button type="button" data-type="Spill Kit">Spill Kit</button>
      <button type="button" data-type="Mask Cabinet">Mask Cabinet</button>
      <button type="button" data-type="SAR">SAR</button>
      <button type="button" data-type="SCBA Station">SCBA Station</button>
      <button type="button" data-type="SCBA Cylinder">SCBA Cylinder</button>
      <button type="button" data-type="SCBA Frame">SCBA Frame</button>
      <button type="button" data-type="SCBA Mask">SCBA Mask</button>
    </div>

    <div id="unitFieldWrapper">
      <label>Unit</label>
      <select id="unitInput"></select>
    </div>

    <!-- Extinguisher fields -->
    <div class="type-fields" id="fields-Extinguisher">
      <label>Location</label>
      <input type="text" id="extLocationInput" placeholder="e.g. Reformer Shelter NE Door">
      <label>Weight & Agent</label>
      <input type="text" id="extWeightAgentInput" placeholder="e.g. 9.5 lbs CleanGuard">
      <label>Serial Number</label>
      <input type="text" id="extSerialNumberInput" placeholder="e.g. printed on the manufacturer label">
      <label>Manufactured Date</label>
      <input type="date" id="extManufacturedDateInput">
      <label>General Inspection</label>
      <select id="extInspectionInput">
        <option value="">— Not set —</option><option value="Pass">Pass</option><option value="Fail">Fail</option><option value="N/A">N/A</option>
      </select>
      <label>Last Inspected</label>
      <input type="date" id="extLastInspectedInput">
      <label>Comments</label>
      <textarea id="extCommentsInput" rows="2"></textarea>
    </div>

    <!-- Emergency Light fields -->
    <div class="type-fields" id="fields-Emergency Light">
      <label>Location</label>
      <input type="text" id="lightLocationInput" placeholder="e.g. RE Shelter NE Dr">
      <label>General Inspection</label>
      <select id="lightInspectionInput">
        <option value="">— Not set —</option><option value="Pass">Pass</option><option value="Fail">Fail</option><option value="N/A">N/A</option>
      </select>
      <label>Last Inspected</label>
      <input type="date" id="lightLastInspectedInput">
      <label>Comments</label>
      <textarea id="lightCommentsInput" rows="2"></textarea>
    </div>

    <!-- Eyewash Station fields -->
    <div class="type-fields" id="fields-Eyewash Station">
      <label>Location</label>
      <input type="text" id="eyewashLocationInput" placeholder="e.g. NFH, Paint Booth">
      <label>General Inspection</label>
      <select id="eyewashInspectionInput">
        <option value="">— Not set —</option><option value="Pass">Pass</option><option value="Fail">Fail</option><option value="N/A">N/A</option>
      </select>
      <label>Last Service</label>
      <input type="date" id="eyewashLastServiceInput">
      <label>Last Inspected</label>
      <input type="date" id="eyewashLastInspectedInput">
      <label>Comments</label>
      <textarea id="eyewashCommentsInput" rows="2"></textarea>
    </div>

    <!-- Spill Kit fields -->
    <div class="type-fields" id="fields-Spill Kit">
      <label>Location</label>
      <input type="text" id="spillLocationInput" placeholder="e.g. NW corner Blaine parking lot">
      <label>Car Seal Intact</label>
      <select id="spillSealInput">
        <option value="">— Not set —</option><option value="Pass">Pass</option><option value="Fail">Fail</option><option value="N/A">N/A</option>
      </select>
      <label>Missing Items</label>
      <input type="text" id="spillMissingItemsInput" placeholder="e.g. none">
      <label>Box Condition</label>
      <input type="text" id="spillBoxConditionInput" placeholder="e.g. Good">
      <label>Last Inspected</label>
      <input type="date" id="spillLastInspectedInput">
      <label>Comments</label>
      <textarea id="spillCommentsInput" rows="2"></textarea>
    </div>

    <!-- Mask Cabinet (multiple masks stored together at a unit) -->
    <div class="type-fields" id="fields-Mask Cabinet">
      <label>Cabinet Location</label>
      <input type="text" id="maskCabLocationInput" placeholder="e.g. Main Control Room Mask Cabinet">
      <label>Cabinet Condition</label>
      <select id="maskCabConditionInput">
        <option value="">— Not set —</option><option value="Pass">Pass</option><option value="Fail">Fail</option><option value="N/A">N/A</option>
      </select>

      <div class="subsection-label">Masks in this cabinet</div>
      <div id="maskCabRowsContainer"></div>
      <button type="button" id="maskCabAddRowBtn" style="width:100%;margin-top:8px;padding:10px;border-radius:8px;border:1px dashed var(--card-border);background:none;color:var(--accent);font-size:13px;cursor:pointer;">+ Add Mask</button>

      <label>SAR Number</label>
      <div class="input-with-scan">
        <input type="text" id="maskCabSarNumberInput" placeholder="Tap 📡 to scan">
        <button type="button" class="scan-nfc-btn" data-target="maskCabSarNumberInput" title="Read tag">📡</button>
        <button type="button" class="scan-cam-btn" data-target="maskCabSarNumberInput" title="Scan barcode">📷</button>
        <button type="button" class="write-nfc-btn" data-target="maskCabSarNumberInput" title="Write ID to tag">✏️</button>
      </div>
      <label>Mask Box</label>
      <select id="maskCabBoxInput">
        <option value="">— Not set —</option><option value="Pass">Pass</option><option value="Fail">Fail</option><option value="N/A">N/A</option>
      </select>

      <label>General Inspection</label>
      <select id="maskCabInspectionInput">
        <option value="">— Not set —</op
